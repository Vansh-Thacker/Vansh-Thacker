    <text x="600" y="38" text-anchor="middle" style="font:700 15px 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;fill:#f4f4f4;letter-spacing:3px">THANKS FOR WATCHING THE RACE</text>
