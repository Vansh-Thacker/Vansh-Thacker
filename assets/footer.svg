      <rect width="32" height="32" fill="#f4f4f4"/><rect width="16" height="16" fill="#0d0f13"/><rect x="16" y="16" width="16" height="16" fill="#0d0f13"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="64" rx="10"/></clipPath>
